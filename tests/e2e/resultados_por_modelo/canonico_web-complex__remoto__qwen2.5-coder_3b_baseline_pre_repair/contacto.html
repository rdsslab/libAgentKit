<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Patitas Felices</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="precios.html">Precios</a></li>
                <li class="active"><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact-form">
            <h2>Contactanos</h2>
            <form id="data-contacto" action="#" method="post" data-form-exito="¡Gracias por contactarnos!">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" required>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" required></textarea>

                <button type="submit">Enviar</button>
            </form>
        </section>
        <section class="contact-info">
            <h2>Información de Contacto</h2>
            <p><strong>Dirección:</strong> Calle Principal 123, Ciudad</p>
            <p><strong>Teléfono:</strong> (55) 1234-5678</p>
            <p><strong>Email:</strong> info@patitasfelices.com</p>
            <p><strong>Horarios:</strong> Lunes a Viernes: 9:00 AM - 5:00 PM</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Patitas Felices. Todos los derechos reservados.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
