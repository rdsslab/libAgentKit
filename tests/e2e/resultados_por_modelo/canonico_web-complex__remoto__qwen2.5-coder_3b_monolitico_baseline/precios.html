<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="precios">
    <div class="container">
        <h1>Precios</h1>
        <div class="plan">
            <h2>Plan Mensual</h2>
            <p data-mensual="100">Precio Mensual: $100</p>
            <p data-anual="1200">Precio Anual: $1200</p>
            <button data-price-toggle="mensual">Ver más</button>
        </div>
        <div class="plan">
            <h2>Plan Anual</h2>
            <p data-mensual="120">Precio Mensual: $120</p>
            <p data-anual="1440">Precio Anual: $1440</p>
            <button data-price-toggle="anual">Ver más</button>
        </div>
        <div class="plan">
            <h2>Plan Premium</h2>
            <p data-mensual="150">Precio Mensual: $150</p>
            <p data-anual="1800">Precio Anual: $1800</p>
            <button data-price-toggle="premium">Ver más</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
