<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patitas Felices</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    color: #333;
  }
  header {
    background-color: #2c3e50;
    color: #ecf0f1;
    padding: 1rem 2rem;
    text-align: center;
  }
  nav ul {
    list-style: none;
    display: flex;
    justify-content: center;
    gap: 1rem;
  }
  nav a {
    color: #ecf0f1;
    text-decoration: none;
    font-size: 1rem;
  }
  header h1 {
    margin-bottom: 0.5rem;
  }
  .hero {
    background-color: #ecf0f1;
    color: #2c3e50;
    padding: 2rem;
    text-align: center;
  }
  .hero h1 {
    font-size: 2rem;
    margin-bottom: 1rem;
  }
  .cta {
    display: inline-block;
    background-color: #2c3e50;
    color: #ecf0f1;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    text-decoration: none;
    font-size: 1rem;
  }
  .services {
    display: flex;
    justify-content: space-around;
    gap: 2rem;
    padding: 2rem;
  }
  .service {
    background-color: #ecf0f1;
    border: 1px solid #bdc3c7;
    border-radius: 4px;
    padding: 1rem;
    text-align: center;
  }
  .service h3 {
    margin-top: 0;
    font-size: 1.2rem;
  }
  .service p {
    margin-bottom: 0.5rem;
  }
  .prices {
    display: flex;
    justify-content: space-around;
    gap: 2rem
