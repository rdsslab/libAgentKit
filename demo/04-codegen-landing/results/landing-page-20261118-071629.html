<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Landing Page con Animación de Botones</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      padding: 60px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
    }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      color: #2c3e50;
      font-weight: 700;
    }

    p {
      font-size: 1.2rem;
      color: #7f8c8d;
      max-width: 800px;
      margin: 0 auto 40px;
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 40px;
    }

    .btn {
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }

    .btn-primary {
      background-color: #3498db;
      color: white;
    }

    .btn-secondary {
      background-color: #e74c3c;
      color: white;
    }

    .btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .btn-primary:hover {
      background-color: #2980b9;
      transform: translateY(-8px);
    }

    .btn-secondary:hover {
      background-color: #c0392b;
      transform: translateY(-8px);
    }

    .btn:active {
      transform: translateY(-2px);
    }

    .btn-primary:active {
      background-color: #2c3e50;
    }

    .btn-secondary:active {
      background-color: #a93226;
    }

    footer {
      text-align: center;
      margin-top: 80px;
      padding: 20px;
      color: #7f8c8d;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.5rem;
      }
      p {
        font-size: 1rem;
      }
      .button-group {
        gap: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Bienvenido a Nuestra App</h1>
      <p>Descubre una experiencia moderna y fácil de usar. Haz clic en uno de los botones para comenzar tu viaje.</p>
    </header>

    <div class="button-group">
      <button class="btn btn-primary" id="btn1">Iniciar Sesión</button>
      <button class="btn btn-secondary" id="btn2">Registrarse</button>
    </div>

    <footer>
      &copy; 2024 Mi Aplicación. Todos los derechos reservados.
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const buttons = document.querySelectorAll('.btn');

      buttons.forEach(btn => {
        btn.addEventListener('mouseenter', () => {
          btn.style.transform = 'translateY(-5px)';
          btn.style.boxShadow = '0 10px 25px rgba(0, 0, 0, 0.15)';
        });

        btn.addEventListener('mouseleave', () => {
          btn.style.transform = 'translateY(0)';
          btn.style.boxShadow = '0 4px 15px rgba(0, 0, 0, 0.1)';
        });

        btn.addEventListener('click', () => {
          btn.style.transform = 'translateY(-2px)';
          btn.style.boxShadow = '0 8px 20px rgba(0, 0, 0, 0.2)';
          
          setTimeout(() => {
            btn.style.transform = 'translateY(0)';
            btn.style.boxShadow = '0 4px 15px rgba(0, 0, 0, 0.1)';
          }, 300);
        });
      });
    });
  </script>
</body>
</html>
