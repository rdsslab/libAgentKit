<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Landing Page</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }

    .btn {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    .btn2 {
      background-color: #007BFF;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn2:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 600px) {
      .btn, .btn2 {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="btn" onclick="animateBtn('btn')">Click Me</button>
    <button class="btn2" onclick="animateBtn('btn2')">Hover Me</button>

    <script>
      function animateBtn(button) {
        const element = document.getElementById(button);
        element.style.display = 'none';
        setTimeout(() => {
          element.style.display = 'block';
          element.classList.add('pulse');
        }, 100);
      }
    </script>

  </div>

</body>
</html>
